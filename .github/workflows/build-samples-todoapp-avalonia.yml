name: Build Sample - TodoApp Avalonia

on:
  workflow_call:

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  # Debug (not Release): this is a build-only compile sanity check, never published/shipped.
  # Release triggers the real ILLink trimmer (not just the trim analyzer) on the iOS head even
  # for a plain `dotnet build` of a simulator RID - "Optimizing assemblies for
  # size"/"IL stripping assemblies" dominated ~90% of that job's build time (15+ minutes).
  # Debug avoids that IL trimming/AOT machinery entirely (see
  # https://blog.verslu.is/maui/exclude-assemblies-from-trimming/ and
  # https://github.com/CommunityToolkit/Datasync/issues/521), so all sample CI workflows build
  # Debug for consistency, even on heads where it isn't currently an issue.
  DOTNET_CONFIGURATION: 'Debug'
  # NOTE: This sample's solution (TodoApp.Avalonia.sln) also contains Android and iOS heads
  # (net10.0-android / net10.0-ios). Only the shared and Desktop (net10.0) projects are built
  # directly here, not the full .sln - the Android and iOS heads are built by their own jobs
  # below, each restoring/building its own project directly so only the workload needed for
  # that head is installed on that runner.
  SharedProjectFile: 'samples/todoapp/TodoApp.Avalonia/TodoApp.Avalonia/TodoApp.Avalonia.csproj'
  DesktopProjectFile: 'samples/todoapp/TodoApp.Avalonia/TodoApp.Avalonia.Desktop/TodoApp.Avalonia.Desktop.csproj'
  AndroidProjectFile: 'samples/todoapp/TodoApp.Avalonia/TodoApp.Avalonia.Android/TodoApp.Avalonia.Android.csproj'
  iOSProjectFile: 'samples/todoapp/TodoApp.Avalonia/TodoApp.Avalonia.iOS/TodoApp.Avalonia.iOS.csproj'

permissions:
  contents: read

jobs:
  desktop:
    # Pinned to ubuntu-26.04 (not a floating label) so the runner image only changes when we choose.
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore shared project
        run: dotnet restore ${{ env.SharedProjectFile }}

      - name: Build shared project
        run: >
          dotnet build ${{ env.SharedProjectFile }}
          --configuration ${{ env.DOTNET_CONFIGURATION }}
          --no-restore

      - name: Restore desktop project
        run: dotnet restore ${{ env.DesktopProjectFile }}

      - name: Build desktop project
        run: >
          dotnet build ${{ env.DesktopProjectFile }}
          --configuration ${{ env.DOTNET_CONFIGURATION }}
          --no-restore

  android:
    # Pinned to ubuntu-26.04 (not a floating label) so the runner image only changes when we choose.
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install Android workload
        run: dotnet workload install android

      - name: Restore Android project
        run: dotnet restore ${{ env.AndroidProjectFile }}

      - name: Build Android project
        run: >
          dotnet build ${{ env.AndroidProjectFile }}
          --configuration ${{ env.DOTNET_CONFIGURATION }}
          --no-restore

  ios:
    # iOS builds require Xcode, which is only available on macOS runners.
    # Pinned to macos-26 (rather than macos-latest) so the Xcode toolchain doesn't change
    # underneath us when the macos-latest label moves. macos-26 replaced the previous
    # (older) macOS image because macOS arm64 jobs on that image repeatedly failed to acquire
    # a runner due to capacity constraints (see
    # https://github.com/CommunityToolkit/Datasync/issues/622).
    #
    # The workload set and Xcode are pinned together (see WorkloadSetVersion and
    # RequiredXcodeVersion below). See https://github.com/CommunityToolkit/Datasync/issues/627.
    runs-on: macos-26
    env:
      # `dotnet workload install ios` with no `--version` resolves the newest published
      # workload set, which can move to an iOS SDK pack that needs an Xcode that isn't on the
      # runner image yet. As of workload set 10.0.115 that's Microsoft.iOS.Sdk.net10.0_27.2, which
      # requires Xcode 27.2 (macos-26 only has Xcode 26.x), and the build fails with
      # "This version of .NET for iOS requires Xcode 27.2". Workload set 10.0.112 is the newest
      # set on the 26.x pack line (Microsoft.iOS.Sdk.net10.0_26.5, 26.5.10318), which requires
      # Xcode 26.6 - the macos-26 default today, selected explicitly (see the "Select Xcode" step
      # below) so a future change of the image default does not silently break the pairing.
      # Sets 10.0.113 and later move to the 27.x pack line. `--version` pins only this job's
      # `dotnet workload install` invocation and the `restore`/`build` steps that follow it in
      # the same runner - it's intentionally not a repo-wide global.json pin, which would
      # force every `dotnet` invocation in the whole repo (including samples with no workload
      # dependency at all) to require this exact workload version to already be installed,
      # breaking them on a fresh runner. Move to the 27.x pack line together with Xcode 27 once
      # it is available on a standard runner image.
      WorkloadSetVersion: '10.0.112'
      RequiredXcodeVersion: '26.6'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Select Xcode ${{ env.RequiredXcodeVersion }}
        # Pin the Xcode the pinned iOS workload (see WorkloadSetVersion above) requires, rather
        # than relying on the image default. Xcode 26.6 is already installed on the image, so
        # this just makes the selection explicit instead of installing anything extra.
        run: sudo xcode-select -s /Applications/Xcode_${{ env.RequiredXcodeVersion }}.app

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install iOS workload
        run: dotnet workload install ios --version ${{ env.WorkloadSetVersion }}

      - name: Restore iOS project
        run: dotnet restore ${{ env.iOSProjectFile }}

      - name: Build iOS project
        run: >
          dotnet build ${{ env.iOSProjectFile }}
          --configuration ${{ env.DOTNET_CONFIGURATION }}
          --no-restore
